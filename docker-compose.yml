networks:
  moodle_jupyter_net:
    driver: bridge
    name: moodle_jupyter_net
    # caddy, jupyterhub y api_go viven aquí: jupyterhub/los contenedores de
    # estudiantes necesitan poder llegar a api_go por su nombre de servicio.
  backend_db_net:
    driver: bridge
    internal: true
    # red aislada, sin salida a internet: solo api_go y postgres-database
    # están aquí. jupyterhub NO tiene por qué poder hablarle a la base de
    # datos directamente, solo al backend.

volumes:
  caddy_data:
  postgres-data:
  hub_estado:
  # El curso de nbgrader del docente (source/, release/, submitted/, gradebook).
  # Solo lo monta el contenedor del instructor (ver jupyterhub_config.py).
  nbgrader_shared:
    external: true
  # Base y ficheros del servicio de intercambio. Aquí viven las liberaciones y
  # las entregas hasta que el docente las recoge. Ningún otro contenedor lo
  # monta: se llega por HTTP.
  nbexchange_data:

services:
  caddy:
    image: caddy:2.8-alpine
    container_name: proxy_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # El Caddyfile las lee como {$AVA_DOMINIO} y {$AVA_MOODLE}. Sin esto el
      # dominio habria que escribirlo dentro del fichero, y mudar el AVA de
      # maquina significaba acordarse de editarlo a mano.
      - AVA_DOMINIO=${AVA_DOMINIO:-localhost}
      - AVA_MOODLE=${AVA_MOODLE:-https://lms.uis.edu.co}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    networks:
      - moodle_jupyter_net

  jupyterhub:
    build:
      context: ./hub_config
      dockerfile: Dockerfile.hub
      provenance: false
      sbom: false
    container_name: jupyterhub
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./hub_config/jupyterhub_config.py:/srv/jupyterhub/jupyterhub_config.py
      # Base y secreto de cookies del Hub: sin esto, cada redespliegue los borra
      # y el Hub pierde de vista los contenedores que ya estaban corriendo.
      - hub_estado:/srv/jupyterhub/data
    networks:
      - moodle_jupyter_net
    env_file:
      - .env
    environment:
      - DOCKER_NETWORK_NAME=moodle_jupyter_net
      - JUPYTERHUB_CRYPT_KEY=${JUPYTERHUB_CRYPT_KEY}
      # Por defecto SÍ se envía. Antes el defecto era "false", y un .env sin esta
      # línea tiraba a la basura toda la telemetría del curso sin avisar: el
      # puente responde 200 «simulado» y nadie mira el log del contenedor.
      # Quien quiera el modo simulación ahora tiene que pedirlo a propósito.
      - ENVIAR_AL_BACKEND=${ENVIAR_AL_BACKEND:-true}
      # El Hub reenvía estas al contenedor del alumno (ver auth_state_a_env).
      - TUTOR_IA_HABILITADO=${TUTOR_IA_HABILITADO:-true}
      - TUTOR_MAX_PREGUNTAS=${TUTOR_MAX_PREGUNTAS:-5}
      # Token maestro con el que el Hub pide a la API un token por alumno
      # (ver _mintear_token_estudiante). Sin el, la telemetria se descarta.
      - METRICS_API_TOKEN=${METRICS_API_TOKEN:-}
      # Servicio de intercambio de nbgrader (ver NBEXCHANGE.md). El token es el
      # mismo que recibe el servicio: asi el Hub sabe que es el y le deja leer
      # quien es cada usuario.
      - NBEXCHANGE_URL=http://nbexchange:9000
      - NBEXCHANGE_API_TOKEN=${NBEXCHANGE_API_TOKEN:-}

  nbexchange:
    build:
      context: ./nbexchange
      provenance: false
      sbom: false
    container_name: nbexchange
    restart: unless-stopped
    # Sin `ports`: solo se le habla desde la red interna (Hub y contenedores de
    # alumnos/docente). Nada de esto pasa por Caddy.
    environment:
      # La API interna del Hub (hub_port por defecto, 8081). Con ella valida el
      # token de cada contenedor que lo llama y lee el auth_state del usuario.
      - JUPYTERHUB_API_URL=http://jupyterhub:8081/hub/api
      - JUPYTERHUB_API_TOKEN=${NBEXCHANGE_API_TOKEN:-}
      - JUPYTERHUB_SERVICE_PREFIX=/services/nbexchange/
      # Base propia del servicio, SEPARADA de la de telemetria: SQLite en su
      # volumen. Cambiarla a Postgres es cambiar esta URL (y meter el servicio
      # en backend_db_net); hoy no hace falta, guarda unos cientos de filas.
      - NBEX_DB_URL=sqlite:////var/nbexchange/nbexchange.sqlite
      - NBEX_BASE_STORE=/var/nbexchange/almacen
      # Tope por subida. Un cuadernillo pesa ~350 KB; 50 MB sobra. El cliente
      # (notebook/nbgrader_config.py) usa el mismo valor.
      - NBEX_MAX_BUFFER_SIZE=52428800
    volumes:
      - nbexchange_data:/var/nbexchange
    networks:
      - moodle_jupyter_net

  api_go:
    build:
      context: ./backend
      provenance: false  # evita el manifest list de attestation que causa "exec format error"
      sbom: false
    container_name: mi-backend-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Tutor IA: dos claves = dos clientes de Gemini en paralelo (pkg/tutor).
      # Si faltan, la API arranca igual y el tutor responde 503.
      - GOOGLE_API_KEY_1=${GOOGLE_API_KEY_1:-}
      - GOOGLE_API_KEY_2=${GOOGLE_API_KEY_2:-}
      - TUTOR_ALIAS=${TUTOR_ALIAS:-Ava}
      - TUTOR_MODELO=${TUTOR_MODELO:-gemini-3.5-flash}
      # Telemetria: METRICS_API_TOKEN autoriza a quien puede pedir tokens (solo
      # el Hub); METRICS_TOKEN_SECRET los firma. Si el secreto va vacio, la
      # ingesta se acepta sin verificar identidad y se avisa por el log.
      - METRICS_API_TOKEN=${METRICS_API_TOKEN:-}
      - METRICS_TOKEN_SECRET=${METRICS_TOKEN_SECRET:-}
    # Las entregas de los alumnos ya no pasan por aqui: van al servicio
    # nbexchange y el docente las recoge desde formgrader. El backend no monta
    # el volumen de nbgrader.
    depends_on:
      postgres-database:
        condition: service_healthy
    networks:
      - moodle_jupyter_net   # recibe requests de jupyterhub / contenedores de estudiantes
      - backend_db_net       # habla con postgres

  postgres-database:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5436:5432"   # solo accesible desde la propia VM (ej. psql manual), no desde internet
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      # El esquema v2, no el v1: es el que trae competencias, notas y el CHECK
      # que acepta 'sin_validar'. Se aplico a mano sobre la base viva, asi que
      # montar el v1 aqui significaba que recrear el volumen dejaba una base sin
      # la mitad del AVA, fallando en silencio.
      - ./database/schema_v2.sql:/docker-entrypoint-initdb.d/schema.sql
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend_db_net